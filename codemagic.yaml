workflows:
  ios-release:
    name: iOS release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: FitGear
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.shadow4167.fitgearai
      vars:
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Sync Capacitor iOS project
        script: npx cap sync ios
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Set build number
        script: cd ios/App && agvtool new-version -all $BUILD_NUMBER
      - name: Build ipa
        script: xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
